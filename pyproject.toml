[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multichat"
dynamic = ["version"]
description = "Twitch, Kick and YouTube chat in one window – with video tiles, emotes, moderation and an OBS overlay"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "pytchat>=0.5.5",
    "curl_cffi>=0.7",
    "requests>=2.31",
    "mpv>=1.0.5",
    "yt-dlp[default]>=2025.11.12",
    "streamlink>=7.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Corrgan/multichat"

[project.scripts]
multichat = "multichat.app:main"

[tool.setuptools.dynamic]
version = { attr = "multichat.__version__" }

[tool.setuptools.packages.find]
include = ["multichat*"]

[tool.setuptools.package-data]
multichat = ["resources/*", "resources/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
