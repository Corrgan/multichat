# SPDX-License-Identifier: GPL-3.0-or-later
#
# Baut die AppImage auf GitHub.
#
# - Manuell (Actions → AppImage → „Run workflow“): AppImage als Artefakt zum Herunterladen.
# - Tag „v*“ pushen (z. B. `git tag v0.10 && git push origin v0.10`): zusätzlich ein
#   GitHub-Release mit AppImage und Prüfsumme. Der Tag muss zu APP_VERSION in logsetup.py passen.
#
# Gebaut wird in einem Ubuntu-22.04-Container (glibc 2.35). Die AppImage läuft damit auf allen
# Systemen mit glibc ≥ 2.35, z. B. Ubuntu 22.04+, Debian 12+, Fedora 36+, aktuelles Arch.
name: AppImage

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # für das Release

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: System-Pakete und Python 3.12
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            software-properties-common gpg-agent curl ca-certificates git file binutils
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          # Python + die Laufzeit-Bibliotheken von Qt (X11/Wayland), damit PyInstaller sie mitnimmt
          apt-get install -y --no-install-recommends \
            python3.12 python3.12-venv python3.12-dev \
            libgl1 libegl1 libglib2.0-0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-xfixes0 libx11-xcb1 libxrender1 libxi6 libsm6 libice6 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libmpv1

      - uses: actions/checkout@v7

      - name: Tag gegen APP_VERSION prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python3.12 -c 'import re; print(re.search(r"APP_VERSION = \"(.+?)\"", open("logsetup.py").read()).group(1))')
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu APP_VERSION $V in logsetup.py"
            exit 1
          fi

      - name: AppImage bauen
        run: PYTHON=python3.12 ./build-appimage.sh

      - name: Selbsttest der AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./MultiChat-x86_64.AppImage --selftest

      - name: Prüfsumme
        run: sha256sum MultiChat-x86_64.AppImage | tee MultiChat-x86_64.AppImage.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: MultiChat-x86_64-AppImage
          path: |
            MultiChat-x86_64.AppImage
            MultiChat-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            MultiChat-x86_64.AppImage
            MultiChat-x86_64.AppImage.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
