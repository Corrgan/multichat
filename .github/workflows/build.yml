# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the AppImage and the Flatpak on GitHub.
#
# - Manual (Actions → Build → "Run workflow"): both as downloadable artifacts.
# - Pushing a tag (e.g. `git tag v0.20 && git push origin v0.20`): additionally a GitHub release
#   with both files and checksums – but only for tags of the form vX.Y where Y is a single digit
#   or ends in 0 (v0.10, v0.20, v1.6, v2.0), plus the exceptions in EXTRA_RELEASES (v0.25).
#   Other tags (v0.11, v0.15, v0.10.1 …) build nothing.
#   The tag must also match __version__ in multichat/__init__.py.
#
# The AppImage is built in an Ubuntu 22.04 container (glibc 2.35), so it runs on all systems
# with glibc ≥ 2.35, e.g. Ubuntu 22.04+, Debian 12+, Fedora 36+, current Arch.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read  # write access only for the build job (release)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Check tag rule
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.rule.outputs.build }}
    steps:
      - id: rule
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          EXTRA_RELEASES: v0.25  # one-off exceptions to the rule (v0.25: first Flatpak)
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.([0-9]|[0-9]+0)$ ]]; then
            echo "Tag $TAG matches the release rule"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [[ " $EXTRA_RELEASES " == *" $TAG "* ]]; then
            echo "Tag $TAG is an extra release"
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tag $TAG is not a release tag (only vX.Y with Y a single digit or ending in 0) – no build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # Releases only from main: the tagged commit must be part of main's history
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.ref_type == 'tag' && steps.rule.outputs.build == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag must be on main
        if: github.ref_type == 'tag' && steps.rule.outputs.build == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG is on main"
          else
            echo "::error::Tag $TAG is not on main – releases are only built from main. Merge first, then tag on main."
            exit 1
          fi

  appimage:
    name: AppImage
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: System packages and Python 3.12
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            software-properties-common gpg-agent curl ca-certificates git file binutils
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          # Python + Qt's runtime libraries (X11/Wayland) so PyInstaller bundles them
          apt-get install -y --no-install-recommends \
            python3.12 python3.12-venv python3.12-dev \
            libgl1 libegl1 libglib2.0-0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-xfixes0 libx11-xcb1 libxrender1 libxi6 libsm6 libice6 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libmpv1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no token in .git/config while third-party code runs

      - name: Check tag against __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python3.12 -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("multichat/__init__.py").read()).group(1))')
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $V in multichat/__init__.py"
            exit 1
          fi

      - name: Build AppImage
        run: PYTHON=python3.12 packaging/build-appimage.sh

      - name: Tests
        run: |
          QT_QPA_PLATFORM=offscreen build-appimage/venv/bin/python -m pytest -q tests

      - name: Self-test of the AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./MultiChat-x86_64.AppImage --selftest

      - name: Checksum
        run: sha256sum MultiChat-x86_64.AppImage | tee MultiChat-x86_64.AppImage.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: MultiChat-x86_64-AppImage
          path: |
            MultiChat-x86_64.AppImage
            MultiChat-x86_64.AppImage.sha256
            tests/data/testclip.webm
          if-no-files-found: error
          retention-days: 14

  appimage-distros:
    # The AppImage takes system libraries from the host – make sure it really works on
    # other distributions than the build machine (TLS, libmpv, decoding a video).
    name: AppImage on ${{ matrix.distro }}
    needs: appimage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:latest
            install: dnf install -y mpv-libs openssl-libs libxkbcommon fontconfig dbus-libs mesa-libEGL ca-certificates
          - distro: debian
            image: debian:stable
            install: apt-get update && apt-get install -y --no-install-recommends libmpv2 libxkbcommon0 libfontconfig1 libdbus-1-3 libegl1 ca-certificates
          - distro: arch
            image: archlinux:latest
            install: pacman -Syu --noconfirm mpv libxkbcommon fontconfig ca-certificates
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: MultiChat-x86_64-AppImage  # contains tests/data/testclip.webm as well

      - name: Install libmpv and desktop libraries
        run: ${{ matrix.install }}

      - name: Self-tests
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x MultiChat-x86_64.AppImage
          ./MultiChat-x86_64.AppImage --selftest
          ./MultiChat-x86_64.AppImage --selftest-net
          ./MultiChat-x86_64.AppImage --selftest-video tests/data/testclip.webm

  flatpak:
    name: Flatpak
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: flatpak-builder and Flathub
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder appstream elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Restore the flatpak-builder cache (mpv, ffmpeg …)
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: .flatpak-builder
          key: flatpak-${{ github.run_id }}
          restore-keys: flatpak-

      - name: Validate metainfo
        run: appstreamcli validate --no-net packaging/io.github.Corrgan.MultiChat.metainfo.xml

      - name: Build Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --repo=build-flatpak/repo build-flatpak/app packaging/flatpak/io.github.Corrgan.MultiChat.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            build-flatpak/repo MultiChat-x86_64.flatpak io.github.Corrgan.MultiChat

      - name: Save the flatpak-builder cache
        if: always()  # also after a failed build, so finished modules are not rebuilt
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: .flatpak-builder
          key: flatpak-${{ github.run_id }}

      - name: Self-test of the Flatpak
        run: |
          flatpak install --user -y --noninteractive MultiChat-x86_64.flatpak
          flatpak run --env=QT_QPA_PLATFORM=offscreen io.github.Corrgan.MultiChat --selftest
          flatpak run --env=QT_QPA_PLATFORM=offscreen io.github.Corrgan.MultiChat --selftest-net
          flatpak run --env=QT_QPA_PLATFORM=offscreen --filesystem="$PWD/tests/data:ro" \
            io.github.Corrgan.MultiChat --selftest-video "$PWD/tests/data/testclip.webm"

      - name: Checksum
        run: sha256sum MultiChat-x86_64.flatpak | tee MultiChat-x86_64.flatpak.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: MultiChat-x86_64-Flatpak
          path: |
            MultiChat-x86_64.flatpak
            MultiChat-x86_64.flatpak.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: [appimage, appimage-distros, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # the only job with write access
      id-token: write  # build provenance (signed by GitHub, verifiable with `gh attestation verify`)
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            MultiChat-x86_64.AppImage
            MultiChat-x86_64.flatpak

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: |
            MultiChat-x86_64.AppImage
            MultiChat-x86_64.AppImage.sha256
            MultiChat-x86_64.flatpak
            MultiChat-x86_64.flatpak.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
