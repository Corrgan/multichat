# Inventory and advisory queries, not a claim of complete native vulnerability coverage.
name: Dependency inventory and advisory triage

on:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/requirements-lock.txt"
      - "packaging/flatpak/**"
      - "packaging/audit-dependencies.py"
      - "packaging/inventory-artifact.py"
      - "packaging/collect-licenses.py"
      - ".github/workflows/dependency-triage.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the hash-checked release Python packages
        run: pip install --require-hashes -r packaging/requirements-lock.txt
      - name: Inventory and query OSV
        run: python packaging/audit-dependencies.py --output dependency-report
      - name: Advisory triage summary
        if: always()
        run: |
          if [ -f dependency-report/summary.md ]; then
            cat dependency-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The advisory scan did not complete; see the failed step. No clean result is available." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: dependency-inventory-and-triage
          path: dependency-report/
          if-no-files-found: warn
          retention-days: 30

  published-artifacts:
    name: Query measured components of the latest published artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Download the release inventory assets without executing the application
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p published-inventory
          gh release view --repo "$REPO" --json tagName,targetCommitish,assets > published-inventory/release.json
          # Releases before the inventories existed (up to v0.80) have nothing to query:
          # that is not a failure of this weekly check.
          count=$(python3 -c "import json; print(sum(a['name'].endswith('-inventory.tar.gz') for a in json.load(open('published-inventory/release.json'))['assets']))")
          if [ "$count" -eq 0 ]; then
            echo "::notice::The latest release has no artifact inventories yet – nothing to query until the next release."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          gh release download --repo "$REPO" --pattern 'MultiChat-*-inventory.tar.gz' --dir published-inventory
          gh --version > published-inventory/gh-version.txt
          for inventory in published-inventory/*.tar.gz; do
            gh attestation verify "$inventory" --repo "$REPO" >> published-inventory/attestation-verification.txt
          done
          python - <<'PY'
          import pathlib, tarfile
          archives = list(pathlib.Path('published-inventory').glob('*.tar.gz'))
          if len(archives) != 2:
              raise SystemExit('Latest release has no complete pair of artifact inventory assets; no clean scan can be claimed')
          for path in archives:
              with tarfile.open(path) as archive:
                  archive.extractall(path='published-inventory', filter='data')
          PY
      - name: Query actual shipped Python and measured native versions
        if: steps.assets.outputs.found == 'true'
        run: |
          python packaging/audit-dependencies.py \
            --inventory-file published-inventory/appimage-inventory/inventory.json \
            --inventory-file published-inventory/flatpak-inventory/inventory.json \
            --output published-dependency-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: published-artifact-inventory-and-triage
          path: |
            published-inventory/
            published-dependency-report/
          retention-days: 30
