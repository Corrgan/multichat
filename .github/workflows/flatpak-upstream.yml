# Weekly: compare all monitored native versions with Flathub's mpv.
# Only a complete comparison can create a version-difference reminder.
name: Flatpak libraries check

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compare with Flathub's io.mpv.Mpv
        id: check
        run: |
          result=0
          python3 packaging/flatpak/check-upstream.py > report.md 2>&1 || result=$?
          cat report.md
          case "$result" in
            0) echo "result=match" >> "$GITHUB_OUTPUT" ;;
            1) echo "result=different" >> "$GITHUB_OUTPUT" ;;
            *) echo "result=unknown" >> "$GITHUB_OUTPUT"
               echo "::error::Native version comparison failed; no version-difference issue will be created."
               exit 1 ;;
          esac

      - name: Open a reminder issue
        if: steps.check.outputs.result == 'different'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Flatpak: native library versions differ from Flathub's mpv"
        run: |
          count=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq length)
          if ! [[ "$count" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine the number of existing reminder issues."
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            {
              echo "The complete weekly comparison found different versions in Flathub's io.mpv.Mpv manifest (not necessarily newer):"
              echo
              cat report.md
              echo
              echo "Update the tags/commits (and sha256 for archives) in packaging/flatpak/io.github.Corrgan.MultiChat.yml,"
              echo "then run the Build workflow. Security fixes in FFmpeg reach the Flatpak only this way."
            } > body.md
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          else
            echo "An open reminder issue already exists."
          fi
