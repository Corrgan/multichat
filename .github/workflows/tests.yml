# Fast checks for every push and pull request (also Dependabot's): the test suite and
# the consistency of the packaging files. The full AppImage/Flatpak build is in build.yml.
name: Tests

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MULTICHAT_REQUIRE_MPV: "1"
      MULTICHAT_REQUIRE_SECURE_LXML: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: System libraries (Qt, libmpv for the video test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv2 libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 xvfb xauth libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libx11-xcb1

      - name: Python packages (hash-checked)
        run: pip install --require-hashes -r packaging/requirements-lock.txt

      - name: Corrected native XML libraries for the release environment
        run: |
          sudo apt-get install -y --no-install-recommends gcc make pkg-config binutils zlib1g-dev
          python packaging/build-secure-lxml.py --work build-secure-lxml --output build-secure-lxml/wheels --install

      - name: Tests
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 python -m pytest -q tests

  source-compatibility:
    name: Source compatibility on Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    env:
      MULTICHAT_REQUIRE_MPV: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv2 libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 xvfb xauth libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxkbcommon-x11-0 libx11-xcb1
      # Resolve compatible source dependencies; this intentionally differs from the
      # separate, hash-checked Python 3.12 release build above.
      - name: Resolve source dependencies for this interpreter
        run: pip install '.[test]'
      - name: Tests against the resolved source installation
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 python -m pytest -q tests
