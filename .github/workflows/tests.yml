# Fast checks for every push and pull request (also Dependabot's): the test suite and
# the consistency of the packaging files. The full AppImage/Flatpak build is in build.yml.
name: Tests

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: System libraries (Qt, libmpv for the video test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmpv2 libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3

      - name: Python packages (hash-checked)
        run: pip install --require-hashes -r packaging/requirements-lock.txt

      - name: Tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q tests
